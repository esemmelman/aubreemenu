<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183d35"><title>Aubree's Learning Menu</title><link rel="stylesheet" href="style.css"></head>
<body><a class="skip" href="#menus">Skip to subjects</a><header><div><p class="eyebrow">A PLACE FOR EVERY SUBJECT</p><h1>Aubree’s Learning Menu</h1><p>Choose a subject. Select a link. Start learning.</p></div><button id="admin">Admin</button></header>
<main><div class="toolbar"><label for="text-size">Text size <select id="text-size"><option value="28">Large</option><option value="34">Extra large</option><option value="42">Largest</option></select></label><button id="refresh">Refresh menus</button></div><p id="status" role="status" aria-live="polite">Loading your menus…</p><div id="menus" class="menus"></div></main>
<dialog id="login"><form id="login-form"><h2>Admin access</h2><label for="passcode">Passcode</label><input id="passcode" type="password" autocomplete="current-password" required maxlength="100"><p id="login-error" role="alert"></p><div class="actions"><button type="button" data-close="login">Cancel</button><button class="primary" type="submit">Unlock editing</button></div></form></dialog>
<dialog id="editor"><form id="item-form"><h2 id="editor-title">Add item</h2><label for="item-name">Item name</label><input id="item-name" required maxlength="160"><label for="item-url">URL</label><input id="item-url" type="url" required maxlength="2048" placeholder="https://example.com"><p id="edit-error" role="alert"></p><div class="actions"><button type="button" data-close="editor">Cancel</button><button class="primary" type="submit">Save item</button></div></form></dialog>
<dialog id="delete-dialog"><form id="delete-form"><h2>Delete item?</h2><p id="delete-description"></p><p id="delete-error" role="alert"></p><div class="actions"><button type="button" data-close="delete-dialog">Cancel</button><button class="danger" type="submit">Delete item</button></div></form></dialog><script type="module" src="app.js"></script></body></html>
